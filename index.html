<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Kyle Michael Sullivan is a Full-Stack Developer, Educator, and Licensed Attorney specializing in React, TypeScript, Next.js, and modern web technologies. Explore my portfolio and experience."
		/>
		<meta name="author" content="Kyle Michael Sullivan" />
		<meta name="theme-color" content="#003049" />

		<!-- Resource Hints for Performance -->
		<link rel="preconnect" href="https://kylemichaelsullivan.com" />
		<link rel="dns-prefetch" href="https://github.com" />
		<link rel="dns-prefetch" href="https://linkedin.com" />

		<!-- Critical CSS for FCP -->
		<style>
			*,
			:before,
			:after {
				box-sizing: border-box;
				border: 0 solid;
			}
			:root {
				--palette-primary: #d62828;
				--palette-accent: #003049;
				--palette-white: #fff;
				--palette-black: #000;
				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			html {
				line-height: 1.5;
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					Segoe UI,
					Roboto,
					Helvetica Neue,
					Arial,
					sans-serif;
			}
			body {
				margin: 0;
				line-height: inherit;
			}
			h1,
			h2,
			h3,
			p {
				margin: 0;
			}
			a {
				color: var(--palette-primary);
				text-decoration: none;
			}
			a:hover,
			a:focus {
				text-decoration: underline;
			}
			.border-b {
				border-bottom-width: 1px;
			}
			.border-black {
				border-color: #000;
			}
			.flex {
				display: flex;
			}
			.p-4 {
				padding: 1rem;
			}
			.Header {
				flex-direction: column;
				justify-content: space-between;
				align-items: center;
			}
			@media (min-width: 640px) {
				.Header {
					flex-direction: row;
				}
			}
		</style>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://kylemichaelsullivan.com/" />
		<meta
			property="og:title"
			content="Kyle Michael Sullivan - Full-Stack Developer | Educator | Lawyer"
		/>
		<meta
			property="og:description"
			content="Kyle Michael Sullivan is a Full-Stack Developer, Educator, and Licensed Attorney specializing in React, TypeScript, Next.js, and modern web technologies."
		/>
		<meta property="og:image" content="https://kylemichaelsullivan.com/favicon.jpg" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://kylemichaelsullivan.com/" />
		<meta
			property="twitter:title"
			content="Kyle Michael Sullivan - Full-Stack Developer | Educator | Lawyer"
		/>
		<meta
			property="twitter:description"
			content="Kyle Michael Sullivan is a Full-Stack Developer, Educator, and Licensed Attorney specializing in React, TypeScript, Next.js, and modern web technologies."
		/>
		<meta property="twitter:image" content="https://kylemichaelsullivan.com/favicon.jpg" />

		<link href="/favicon.jpg" type="image/jpeg" rel="icon" />
		<title>
			Kyle Michael Sullivan - Full-Stack&nbsp;Developer&nbsp;| Educator&nbsp;|&nbsp;Lawyer
		</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
